# Alembic 配置文件
[alembic]
# 脚本位置（相对此文件）
script_location = alembic

# 同步数据库 URL — Alembic 默认用同步驱动
# asyncpg URL 形如 postgresql+asyncpg://... 需转换为 postgresql+psycopg2://...
# 但我们用 env.py 中的 get_url() 动态读取，这里留空占位
sqlalchemy.url =

# 模板生成
# 默认模板支持同步与异步
# timezone =
[post_render_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
